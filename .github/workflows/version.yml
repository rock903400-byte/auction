name: 版號與品質檢查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.16 black==26.5.1 # 鎖版：新版 ruff 預設規則變動會讓 legacy 檔全紅
      - run: python verify_version.py --strict
      - run: ruff check .
      - run: black --check .
