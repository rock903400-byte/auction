name: 法拍資料中繼抓取

# 司法院自 2026-10-29 起阻擋 Google Apps Script 出口 IP（Address unavailable），
# 改由外部抓取原始資料後 POST 給 GAS doPost(action=ingest)。
# ⚠️ 2026-11-02 實測 GitHub Actions（Azure IP）同樣被擋（timeout），故已移除每日排程，
#    正式抓取改由本機 Windows 工作排程器（install_relay_task.ps1）。本檔僅保留手動測試。
# 需在 repo Settings → Secrets and variables → Actions 設定 ADMIN_TOKEN
# （與 GAS 專案屬性 ADMIN_TOKEN 相同）。GAS_URL 選填，預設讀 index.html 的 WEB_APP_URL。
# 排程只認預設分支：本檔需同時存在於 master（預設分支）與 main。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取不送 GAS"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: relay-scrape
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 預設分支 master 只放轉址頁；程式碼在 main
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓取司法院並送入 GAS
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GAS_URL: ${{ secrets.GAS_URL }}
          PYTHONIOENCODING: utf-8
        run: python relay_scrape.py ${{ inputs.dry_run && '--dry-run' || '' }}
