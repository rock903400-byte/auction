name: 法拍資料中繼抓取

# 司法院自 2026-10-29 起阻擋 Google Apps Script 出口 IP（Address unavailable），
# 改由 GitHub Actions 抓取原始資料後 POST 給 GAS doPost(action=ingest)。
# 需在 repo Settings → Secrets and variables → Actions 設定 ADMIN_TOKEN
# （與 GAS 專案屬性 ADMIN_TOKEN 相同）。GAS_URL 選填，預設讀 index.html 的 WEB_APP_URL。

on:
  schedule:
    - cron: "50 23 * * *" # 每日 07:50 台灣時間，早於 GAS 觸發器 09:45
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取不送 GAS"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: relay-scrape
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓取司法院並送入 GAS
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GAS_URL: ${{ secrets.GAS_URL }}
          PYTHONIOENCODING: utf-8
        run: python relay_scrape.py ${{ inputs.dry_run && '--dry-run' || '' }}
